[platformio]
default_envs = lilygo_t_display_s3
test_dir = test

; LilyGO T-Display-S3 (ESP32-S3R8, 16 MB flash, 8 MB OPI PSRAM, native USB).
[env:lilygo_t_display_s3]
platform = espressif32@6.8.1
board = lilygo-t-display-s3
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = app3M_spiffs9M_fact512k_16MB.csv
board_upload.flash_size = 16MB
monitor_speed = 921600
build_flags =
  -DBOARD_HAS_PSRAM
  ; TinyUSB CDC instead of the fixed USB-Serial/JTAG unit, so the port can be
  ; named (see src/usb_identity.cpp).
  -DARDUINO_USB_MODE=0
  ; NimBLE settings for the iPhone now-playing link (src/ble_media.cpp): one
  ; connection, no scanning.
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BT_NIMBLE_MAX_BONDS=4
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
build_unflags = -DARDUINO_USB_MODE=1
lib_deps =
  https://github.com/lovyan03/LovyanGFX.git#fb7cec222726b92676e26126246d59f70f04ced2
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  ESP32Async/ESPAsyncWebServer
  ESP32Async/AsyncTCP
  h2zero/NimBLE-Arduino@2.5.1

[env:native]
platform = native
test_framework = unity
