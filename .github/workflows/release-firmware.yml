name: Release firmware

# Builds versioned firmware images for every board and opens a pull request
# with the new binaries, manifest, and service-worker cache entries.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Firmware version (major.minor.patch), newer than public/firmware/manifest.json
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-firmware
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install dependencies
        run: |
          npm ci
          pip install platformio

      - name: Run web tests
        run: npm test

      - name: Build firmware
        run: python scripts/build_firmware.py "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          branch="release/firmware-$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -A firmware public
          git commit -m "Release firmware $VERSION"
          git push origin "$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "Release firmware $VERSION" \
            --body "Firmware $VERSION built by the [Release firmware workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from $GITHUB_SHA."
